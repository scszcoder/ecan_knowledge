schema {
  query: Query
  mutation: Mutation
}

"Client-generated jobId (UUID), so the client can subscribe to /jobs/{jobId} before starting the job."
input ListingInput {
  jobId: ID!
  imageKeys: [String!]!
  notes: String
  marketplace: String
  targetPrice: Float
}

type UploadUrl {
  key: String!
  url: String!
}

type ListingJob {
  id: ID!
  status: String!          # queued | running | needs_input | done | failed
  match: AWSJSON
  questions: AWSJSON
  draft: AWSJSON
  images: [String!]
  error: String
  updatedAt: String
}

type JobEvent {
  seq: Int!
  event: AWSJSON!
}

type Query {
  listing(jobId: ID!): ListingJob
  "Catch-up after a late subscribe or a reconnect: every event with seq > afterSeq."
  events(jobId: ID!, afterSeq: Int): [JobEvent!]!
}

type Mutation {
  createUploadUrls(jobId: ID!, count: Int!): [UploadUrl!]!
  startListing(input: ListingInput!): ListingJob!
  answer(jobId: ID!, answers: AWSJSON!): ListingJob!
}
